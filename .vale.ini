# Vale configuration — see docs/writing/config/STYLE.md for the project's
# own voice contract and docs/writing/DOCS_TOOLCHAIN_REPORT.md for why
# these specific styles/rules were chosen (not the full Style Hub).
StylesPath = docs/writing/config/styles
MinAlertLevel = suggestion
Vocab = Factory
Packages = write-good, alex

[*.md]
BasedOnStyles = Vale, write-good, alex

# E-Prime bans every form of "to be" (is/are/was/were) outright — flagged
# ordinary technical passive constructions in this corpus's baseline run
# ("was scaffolded", "is based on [Keep a Changelog]"), none of them
# genuine AI-writing tells. Disabled deliberately, not silently — same
# finding, same reasoning, as arcanium/.vale.ini.
write-good.E-Prime = NO

# Flagged "hook" (a Git hook, per CONTRIBUTING.md's own security section)
# as "profane in some cases" — a false positive for this corpus's
# register, confirmed live during the baseline run. Disabled
# deliberately; other alex rules stay on.
alex.ProfanityUnlikely = NO

# "disabled" describes a Vale RULE's config state in this project's own
# writing-toolchain reports ("Vale rules disabled..."), not a person —
# the identical false-positive class arcanium already documented and
# disabled for the same word. Confirmed live during the Gate 3 quality-
# gate run on docs/writing/DOCS_TOOLCHAIN_REPORT.md. Disabled
# deliberately; alex.Condescending and other alex rules stay on.
alex.Ablist = NO

# The synced style packages' own vendored READMEs live under StylesPath —
# never lint third-party package content as if it were this project's
# documentation.
[docs/writing/config/styles/**]
BasedOnStyles =
