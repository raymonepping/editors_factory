# Backend orchestrator — the policy engine, credential broker, and typed
# tool gateway. See prompts/backend/01_01_orchestrator_api.md.
#
# Multi-homed onto both factory-control (reachable by the frontend/
# agents) and factory-vault-internal (factory-api calls vault-1's HTTP
# API directly for auth/token/create, database/creds/*, and
# sys/leases/revoke — Vault Agent only handles the AppRole token itself,
# see src/vault.js's own comment) — matching arcanium-api's own proven
# dual-network pattern exactly, not a new invention.

networks:
  factory-control:
    external: true
  factory-vault-internal:
    external: true

services:
  api:
    build:
      context: ../../backend
      dockerfile: Containerfile
    image: factory-api:local
    container_name: factory-api
    hostname: api
    # Wave 5 hardening (prompts/improvements/01_01_improvement.md) — same
    # pattern as compose/agents/compose.yaml and the vault-agent service
    # this was originally proven on. factory-api's only local filesystem
    # interaction is reading the read-only vault-agent-secrets mount
    # below (backend/src/vault.js's readAgentToken()); it writes nothing
    # to disk, so /tmp is the only tmpfs path needed.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PORT: "3001"
      VAULT_ADDR: "https://vault-1:8200"
      VAULT_NAMESPACE: "${VAULT_NAMESPACE}"
      VAULT_AGENT_TOKEN_FILE: "/vault/secrets/token"
      NODE_EXTRA_CA_CERTS: "/vault/tls/ca-chain.pem"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      DEMO_PROFILE: "${DEMO_PROFILE}"
      AGENT_A_TOKEN: "${AGENT_A_TOKEN}"
      AGENT_B_TOKEN: "${AGENT_B_TOKEN}"
      AGENT_C_TOKEN: "${AGENT_C_TOKEN}"
      AGENT_D_TOKEN: "${AGENT_D_TOKEN}"
      FACTORY_AGENT_JWT_SECRET: "${FACTORY_AGENT_JWT_SECRET}"
      FACTORY_AUTH_ENABLED: "${FACTORY_AUTH_ENABLED:-true}"
      FACTORY_CLI_OPERATOR_TOKEN: "${FACTORY_CLI_OPERATOR_TOKEN}"
      FACTORY_OIDC_ENABLED: "${FACTORY_OIDC_ENABLED:-true}"
      KEYCLOAK_ISSUER_URL: "${KEYCLOAK_ISSUER_URL:-http://keycloak:8080/realms/factory}"
      KEYCLOAK_PUBLIC_ISSUER_URL: "${KEYCLOAK_PUBLIC_ISSUER_URL:-http://localhost:8088/realms/factory}"
      FACTORY_OIDC_CLIENT_ID: "${FACTORY_OIDC_CLIENT_ID:-factory-api}"
      FACTORY_OIDC_CLIENT_SECRET: "${FACTORY_OIDC_CLIENT_SECRET}"
      FACTORY_BASE_URL: "${FACTORY_BASE_URL:-http://localhost:3000}"
      FACTORY_API_CALLBACK_URL: "${FACTORY_API_CALLBACK_URL:-http://localhost:3000/gateway/api/v1/auth/callback}"
    volumes:
      - ../../vault-tls:/vault/tls:ro
      - vault-agent-secrets:/vault/secrets:ro
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - factory-control
      - factory-vault-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  vault-agent-secrets:
    external: true
    name: factory-vault_vault-agent-secrets
