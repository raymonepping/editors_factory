# Ollama — the shared local reasoning runtime for all four agents
# (agent-a/b/c/d). Simple enough to define in full here per
# prompts/base_project/01_01_factory_stack.md; model selection, the pull
# script, and resource-footprint notes remain
# prompts/base_project/04_01_ollama_model_runtime.md's own deliverables.

networks:
  default:
    name: factory-control
    external: true

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: factory-ollama
    hostname: ollama
    restart: unless-stopped
    environment:
      # Tuning pattern matches Personal/malware_scan's own
      # docker-compose.yml ollama service — same reasoning applies here:
      # a small local model still benefits from bounding parallelism and
      # context rather than taking Ollama's untuned defaults.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_DEBUG: "false"
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
        reservations:
          cpus: "4"
          memory: 4G
    healthcheck:
      # `ollama list` calls the local GET /api/tags endpoint. The official
      # image deliberately does not include curl, so using the bundled client
      # keeps this check tied to the API without extending the image.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  ollama-data:
    name: factory-ollama_data
