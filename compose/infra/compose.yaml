# PostgreSQL — the factory's order/catalog database. Adapted from
# vault_reference's vault-postgres service; stripped of everything
# Vault-storage-related, since this Postgres instance has no
# relationship to Vault's own storage backend. See
# prompts/base_project/03_01_postgres_dynamic_creds.md.
#
# The ONLY static credential in this stack is the superuser Vault uses
# once (terraform/vault-database/) to configure the Database secrets
# engine. No agent or application code ever uses it directly — every
# real credential is issued dynamically by Vault
# (factory/database/creds/factory-bad-role,
# factory/database/creds/factory-good-role).

networks:
  default:
    name: factory-control
    external: true

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: factory-postgres
    hostname: postgres
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
    name: factory-infra_postgres-data
