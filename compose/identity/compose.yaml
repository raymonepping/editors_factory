# Identity stack: OpenLDAP (identity store) + Keycloak (OIDC broker).
#
# Adapted from Arcanium's identity architecture (compose/identity/compose.yaml):
#   - Factory-specific LDAP fixture (dc=factory,dc=local)
#   - Keycloak issues ONE confidential client only (factory-api)
#   - Dual-hostname Keycloak config (public vs internal)
#   - LDAP federation with group mapper for factory-operator / factory-viewer
#
# factory-api connects to Keycloak over factory-control (http://keycloak:8080)
# for server-to-server token exchange, JWKS, and userinfo.

networks:
  default:
    name: factory-control
    external: true
  factory-vault-internal:
    # Only identity-secrets-init joins this — it's the one place in this
    # stack that talks to Vault directly (prompts/improvements/01_07).
    external: true

services:
  # prompts/improvements/01_07_vault_kv_secrets_migration.md: fetches
  # OpenLDAP's and Keycloak's admin passwords + the OIDC client secret
  # from Vault KV once at stack start, renders them to a shared volume.
  # See compose/identity/identity-secrets/entrypoint.sh for why this is
  # a one-shot init container rather than a persistent Vault Agent.
  identity-secrets-init:
    image: docker.io/hashicorp/vault-enterprise:2.1.0-ent
    container_name: factory-identity-secrets-init
    entrypoint: ["/bin/sh", "/init/entrypoint.sh"]
    environment:
      VAULT_ADDR: "https://vault-1:8200"
      VAULT_CACERT: "/vault/tls/ca-chain.pem"
      VAULT_NAMESPACE: "factory"
      IDENTITY_SECRETS_ROLE_ID: "${IDENTITY_SECRETS_ROLE_ID}"
      IDENTITY_SECRETS_SECRET_ID: "${IDENTITY_SECRETS_SECRET_ID}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ../../vault-tls:/vault/tls:ro
      - ./identity-secrets/entrypoint.sh:/init/entrypoint.sh:ro
      - identity-secrets:/run/secrets
    networks: [default, factory-vault-internal]
    restart: "no"

  openldap:
    image: docker.io/osixia/openldap:1.5.0
    container_name: factory-openldap
    hostname: openldap
    environment:
      LDAP_ORGANISATION: "The Factory"
      LDAP_DOMAIN: "factory.local"
      LDAP_BASE_DN: "dc=factory,dc=local"
      LDAP_ADMIN_PASSWORD_FILE: "/run/secrets/ldap-admin-password"
      LDAP_TLS: "false"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - identity-secrets:/run/secrets:ro
    networks: [default]
    restart: unless-stopped
    depends_on:
      identity-secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -D cn=admin,dc=factory,dc=local -w \"$(cat /run/secrets/ldap-admin-password)\" -b dc=factory,dc=local -s base"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ldap-bootstrap:
    image: docker.io/osixia/openldap:1.5.0
    container_name: factory-ldap-bootstrap
    profiles: ["init"]
    environment:
      LDAP_ADMIN_PASSWORD_FILE: "/run/secrets/ldap-admin-password"
      LDAP_BASE_DN: "dc=factory,dc=local"
      LDAP_HOST: "openldap"
    entrypoint: ["/bootstrap/setup_ldap.sh"]
    volumes:
      - ./ldap:/bootstrap:ro
      - identity-secrets:/run/secrets:ro
    networks: [default]
    depends_on:
      openldap:
        condition: service_healthy

  ldap-admin:
    image: docker.io/osixia/phpldapadmin:0.9.0
    container_name: factory-ldap-admin
    hostname: ldap-admin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8085:80"
    networks: [default]
    depends_on:
      openldap:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: docker.io/keycloak/keycloak:26.6.4
    container_name: factory-keycloak
    hostname: keycloak
    entrypoint: ["/bin/sh", "/vault/vault-entrypoint.sh"]
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "${KC_HOSTNAME:-localhost:8088}"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/vault-entrypoint.sh:/vault/vault-entrypoint.sh:ro
      - identity-secrets:/run/secrets:ro
    networks: [default]
    depends_on:
      openldap:
        condition: service_healthy
      identity-secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  keycloak-bootstrap:
    image: docker.io/keycloak/keycloak:26.6.4
    container_name: factory-keycloak-bootstrap
    profiles: ["init"]
    entrypoint: ["/bin/bash", "/bootstrap/setup_keycloak.sh"]
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD_FILE: "/run/secrets/keycloak-admin-password"
      LDAP_ADMIN_PASSWORD_FILE: "/run/secrets/ldap-admin-password"
      FACTORY_OIDC_CLIENT_SECRET_FILE: "/run/secrets/oidc-client-secret"
      KC_INTERNAL_URL: "http://keycloak:8080"
      FACTORY_BASE_URL: "${FACTORY_BASE_URL:-http://localhost:3000}"
      FACTORY_API_CALLBACK_URL: "${FACTORY_API_CALLBACK_URL:-http://localhost:3000/gateway/api/v1/auth/callback}"
    volumes:
      - ./keycloak:/bootstrap:ro
      - identity-secrets:/run/secrets:ro
    networks: [default]
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  ldap-data:
    name: factory-identity_ldap-data
  ldap-config:
    name: factory-identity_ldap-config
  keycloak-data:
    name: factory-identity_keycloak-data
  identity-secrets:
    name: factory-identity_identity-secrets
