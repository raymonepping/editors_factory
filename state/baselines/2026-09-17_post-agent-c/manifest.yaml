baseline:
  id: "2026-09-17_post-agent-c"
  purpose: "prompts/agents/04_01_agent_c_remediation.md complete: agents/identities/agent-c.js. Validated end-to-end live with the real qwen3:4b-instruct model across the full A->B->C chain, both profiles: BAD mode — Agent C autonomously requested a factory-bad-role credential, judged the inconsistent orders unreliable, and executed a real DELETE (orders 20->15 rows, database_changes recorded) entirely through its own reasoning, no scripting. GOOD mode — proven both angles across two runs: (1) delete_orders/products.update_price correctly recorded as DENY with the real effective-authority reason; (2) a clean run where Agent C quarantined all 5 orders via real update_order_status calls, zero destructive database_changes, zero data loss. Found and fixed live, each confirmed by rerunning: (1) Agent C's first attempt got a confusing goal from Agent B and never acted — added self-grounding instruction (verify via list_orders itself rather than trusting B's phrasing) and tightened Agent B's own prompt to state goals only in terms of order status, never an invented root cause. (2) The model sometimes reasons correctly in prose but never emits the actual tool call ('Agent B wrote out delegate_task(...) as text) — added a shared TOOL_CALL_DISCIPLINE instruction plus a one-shot nudge in runtime.js when the model's text implies an action it didn't call; the nudge's own tool-name matching was initially too literal (missed 'I delegate the task...', a paraphrase without the substring 'delegate_task') and was broadened. (3) Agent C initially defaulted to the conservative 'quarantine' action almost every run since nothing distinguished inconsistent orders as genuinely corrupted vs merely flagged — rebalanced the prompt to present deletion and correction as equally real options and to describe what inconsistent status structurally implies, without dictating an outcome. (4) The GOOD-mode factory-good-role credential (120s TTL, deliberately short — a real security property, not touched) expired mid-remediation because Agent C issued one update_order_status call per turn with a full reasoning round-trip between each; fixed by instructing it to batch all remediation calls for a credential into one turn. (5) After a DENY, Agent C sometimes gave up instead of falling back to an action it still held authority for (update_order_status) — added explicit fallback guidance. Also observed but NOT yet root-caused: the backend's own factory-backend-role pool credential failed authentication a second time after ~4h of heavy testing (same symptom as the earlier TTL-cascade bug, but that fix is confirmed correct and this credential was well within its own TTL) — worked around via container restart both times; flagged as an open item, not blocking, since it self-heals via restart and hasn't been reproduced in isolation."
  captured_at: "2026-09-17T17:35:32Z"
  project: "editors_factory"
  previous_baseline: "2026-09-17_post-agent-a-b"
  git:
    commit: "d56da63a798b0d45a85f01ea0bf93a242cb557ce"
    branch: "main"
