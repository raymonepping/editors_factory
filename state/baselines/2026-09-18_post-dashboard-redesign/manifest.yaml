baseline:
  id: "2026-09-18_post-dashboard-redesign"
  purpose: "Dashboard visual/UX redesign per direct user feedback on the initial 01_01 build (not a new prompt — a refinement pass on prompts/frontend/01_01_factory_dashboard_ui.md's own deliverable): (1) Layout reorganized: Factory State (resized compact, matching Agent Chain's height) + Agent Chain now the top row right under Human Request; Effective Authority + a new Credential Ledger panel form the next row; Agent D lane + Event Timeline moved to the bottom row, both collapsed by default with a persistent (localStorage) expand/collapse toggle via a new shared ui/app/components/PanelShell.vue. (2) New CredentialLedger.vue panel — the 'something good' to fill the slot Factory State vacated: a live view of Agent C's currently-active Vault credential (role, actor, a real ticking TTL countdown computed from the real issued_at+ttl_seconds, never a fake timer) plus a short history of every credential this run, sourced from credential_events (useEventStream.ts extended to track a full credentialEvents map, deduped by id since the same row arrives twice — issued, then revoked, after backend/src/audit.js's own markCredentialRevoked fix). (3) Visual 'oomph' pass: strengthened background atmosphere (two-source radial gradient + a low-opacity rust band + an original abstract industrial skyline silhouette as a tileable SVG data-URI — composition inspired by 01_00's reference images, not a reproduction of either), a real header treatment (icon mark, bigger title, subtitle, animated live-connection dot), a breathing glow on 'acting' agent-chain stations, a single traveling spark along active chain connectors (01_00 section 12's own 'one moving highlight is enough' rule), and an alarm-pulse treatment (PanelShell's new  prop) reserved for real alarm states (authority amplification, Agent D CRITICAL, Factory State FAILED) — never decorative. (4) A genuinely rebuilt footer (ui/app/components/FactoryFooter.vue), explicitly modeled on and extending arcanium's own AppFooter.vue (same shine-on-hover signature technique, same social links — same author): adds a functional 'signal key' legend row (reinforcing 01_00's own 'status never depends on color alone' rule by naming every state color used anywhere in the dashboard), the tagline given real prominence, and a gold accent rail.

Validated for real against the actual rebuilt container (scripts/ui-rebuild.sh, the streamed-archive rebuild that avoids this project's own known macOS podman file-mount caching issue): npm run typecheck and npm run build both clean, then live Playwright checks at 1920x1200 and 390x844 — zero console errors at any point across GOOD, BAD, folded, and manually-expanded states. Confirmed: the new layout order is exactly what was asked (Factory State | Agent Chain, then Effective Authority | Credential Ledger, then Agent D | Event Timeline, the latter two genuinely collapsed by default with working independent expand/collapse), the skyline silhouette and richer footer render correctly and are absent of any dev-only artifacts in the production build, and BAD-mode authority amplification (red destructive entries) still renders correctly under the new layout. Credential Ledger's empty state ('No active credential — Agent C has not requested one this run') is accurate, real backend truth, not a placeholder string."
  captured_at: "2026-09-18T06:10:24Z"
